name: data-intelligence-demo

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    pull_policy: never
    environment:
      MYSQL_DATABASE: ontology_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo-local-only
      MYSQL_ROOT_PASSWORD: demo-root-local-only
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${DEMO_MYSQL_PORT:-13316}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          --host=127.0.0.1 --user="$${MYSQL_USER}" "$${MYSQL_DATABASE}"
          --silent --skip-column-names
          --execute='SELECT 1 FROM portfolios LIMIT 1' >/dev/null 2>&1
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
    name: data-intelligence-demo-mysql-data
